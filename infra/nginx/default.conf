# Limitation de debit de la chaine audio sur la surface publique. Une
# transcription coute environ deux secondes de processeur sur une machine qui
# n'en a que quatre coeurs : sans garde-fou, le lien public deviendrait un
# service de calcul gratuit. Douze requetes par minute et par adresse suffisent
# a un visiteur qui dicte ; un robot est arrete net.
# Un aperçu de dictee part toutes les trois secondes pendant que le visiteur
# parle, soit vingt requetes par minute en dictee continue : la limite doit
# passer au-dessus, sans quoi elle couperait l'usage normal au lieu de l'abus.
limit_req_zone $binary_remote_addr zone=audio_public:10m rate=24r/m;
# 429 plutot que le 503 par defaut : « trop de requetes » se distingue d'une
# panne du service, et le client peut le traiter comme tel.
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/isaac.crt;
    ssl_certificate_key /etc/nginx/certs/isaac.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /webhook/isaac-visitor {
        proxy_pass http://127.0.0.1:5678/webhook/isaac-visitor;
        proxy_set_header Host $host;
    }

    location /webhook/isaac-rdv {
        proxy_pass http://127.0.0.1:5678/webhook/isaac-rdv;
        proxy_set_header Host $host;
    }

    # --- Chaine audio, reseau prive uniquement ---------------------------------
    # Ces deux services ne sont PAS relayes sur la surface publique 8444. Une
    # transcription coute plusieurs secondes de processeur sur une machine qui
    # n'a que quatre coeurs : l'exposer sans authentification en ferait un
    # service de calcul gratuit pour n'importe qui. La borne, elle, est sur le
    # reseau prive.
    location /audio/transcription {
        proxy_pass http://127.0.0.1:9000/asr;
        proxy_set_header Host $host;
        # Un enregistrement de trente secondes en WAV 16 kHz mono pese pres d'un
        # megaoctet, soit exactement la limite par defaut de nginx.
        client_max_body_size 10m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /audio/synthese {
        proxy_pass http://127.0.0.1:5002/synthese;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /webhook/isaac {
        proxy_pass http://127.0.0.1:5678/webhook/isaac;
        proxy_set_header Host $host;
        # Le modele IA tourne en CPU sur la tour (pas de GPU dedie) : une reponse
        # peut legitimement prendre plus d'une minute. Le timeout nginx par defaut
        # (60s) coupait la connexion avant la fin, ce qui faisait croire a une
        # mauvaise reponse d'Isaac alors que c'etait une coupure prematuree.
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}

# Port public dedie (Tailscale Funnel). PHASE D'EXPERIMENTATION : /admin/ est expose
# publiquement ici a la demande explicite du projet (2026-09-07), le renforcement de
# l'authentification admin (limite de tentatives, verrouillage, MFA) est reporte a plus
# tard. Ne pas oublier de re-isoler /admin/ derriere Tailscale uniquement avant une mise
# en production reelle.
server {
    listen 8444;
    server_name _;
    root /usr/share/nginx/html;

    location /respond/ {
        try_files $uri $uri/ /respond/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /webhook/isaac-respond {
        proxy_pass http://127.0.0.1:5678/webhook/isaac-respond;
        proxy_set_header Host $host;
    }

    location /webhook/isaac-visitor {
        proxy_pass http://127.0.0.1:5678/webhook/isaac-visitor;
        proxy_set_header Host $host;
    }

    location = /webhook/isaac {
        proxy_pass http://127.0.0.1:5678/webhook/isaac;
        proxy_set_header Host $host;
        # Le modele IA tourne en CPU sur la tour (pas de GPU dedie) : une reponse
        # peut legitimement prendre plus d'une minute. Le timeout nginx par defaut
        # (60s) coupait la connexion avant la fin, ce qui faisait croire a une
        # mauvaise reponse d'Isaac alors que c'etait une coupure prematuree.
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location = /assets/logo-st-digital.png {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }


    # Back-office retire de la surface publique le 21/09/2026.
    # Il reste joignable sur le reseau prive, sur le port 8443 ci-dessus.
    # Tout webhook non declare ci-dessus est refuse sur la surface publique
    location /webhook/ { return 404; }

    # --- Chaine audio, surface publique ----------------------------------------
    # Ouverte le 28/09/2026. Elle avait d'abord ete fermee par prudence, ce qui
    # etait une erreur d'appreciation du risque : le dialogue avec le modele,
    # bien plus couteux, est deja ouvert ici. La protection est la limitation de
    # debit, pas la fermeture.
    location /audio/transcription {
        limit_req zone=audio_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:9000/asr;
        proxy_set_header Host $host;
        # Trente secondes de parole en WAV 16 kHz mono pesent environ un
        # megaoctet ; deux laissent de la marge sans ouvrir la porte a des
        # envois volumineux.
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }

    location /audio/synthese {
        limit_req zone=audio_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:5002/synthese;
        proxy_set_header Host $host;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }

    location /admin/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
